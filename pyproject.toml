[build-system]
requires      = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "speech-to-text"
version         = "0.1.0"
description     = "Self-hosted Whisper transcription server with a pooled model backend, a token-authenticated HTTP API and a CLI client."
readme          = "README.md"
license         = "MIT"
license-files   = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "wachawo" },
]
keywords = ["stt", "speech-to-text", "transcription", "whisper", "asr", "diarization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# The HTTP layer, the CLI client and the audio conversion. Deliberately without
# a model backend: openai-whisper pulls torch, and a base install that drags in
# a gigabyte of CUDA wheels is the wrong default for someone who only wants the
# client. The backend lives in the `whisper` extra, and the Docker images
# install from requirements*.txt where the torch build is pinned per image.
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "werkzeug>=3.0.0",
    "uvicorn[standard]>=0.29.0",
    "gunicorn>=22.0.0",
    "pydub>=0.25.1",
    "python-dotenv>=1.0.0",
    "requests>=2.33.0",
]

[project.optional-dependencies]
# The transcription backend. torch and torchaudio come with it, from whichever
# index pip is pointed at; requirements-cpu.txt and requirements-gpu.txt exist
# to pin that choice for the two Docker images.
whisper = [
    "openai-whisper>=20231117",
    "soundfile>=0.12.1",
]
# Speaker diarization. transformers is pinned to a git commit because the model declares
# transformers_version 5.18.0.dev0 while the newest PyPI release is 5.17.0, which does not
# recognise the `nemotron3_diarization` architecture at all. A direct reference like this is
# fine for `python -m build` and for the GitHub Release, and would be rejected by PyPI - so
# swap it for a version pin before this package is ever published there.
# It is an add-on to `whisper`, not a standalone install: torch comes with that one.
#   pip install "speech-to-text[whisper,diarize]"
diarize = [
    "transformers @ git+https://github.com/huggingface/transformers@98d39824ed30e684e5122d04a2d9564efffc4965",
    "soundfile>=0.12.1",
    # The checkpoint's feature extractor requires it; transformers does not install it.
    "librosa>=0.10.1",
]
# The Parakeet transcription backend. No git pin: parakeet_tdt ships in released transformers.
# An add-on rather than a standalone install, like `diarize`: torch comes with `whisper`.
parakeet = [
    "transformers>=5.17.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.1",
]
dev = [
    "black>=26.5.1,<27",
    "ruff>=0.16.7",
    "pre-commit>=4.6.2",
    "mypy>=2.3.1,<3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1",
    "types-requests>=2.33.0.20260906",
    # Not a dev tool: it lets tests/test_diarize_module.py import the REAL libs/diarize.py, which
    # every other test replaces with a stub, so a broken module-level import fails in CI.
    "soundfile>=0.12.1",
]

[project.urls]
Homepage = "https://github.com/wachawo/speech-to-text"
Issues   = "https://github.com/wachawo/speech-to-text/issues"

[project.scripts]
stt-server = "stt_server:main"
stt-client = "stt_client:main"

[tool.setuptools]
py-modules = ["stt_server", "stt_client", "gu"]

[tool.setuptools.packages.find]
include = ["libs*"]

[tool.black]
line-length    = 128
target-version = ["py312"]
extend-exclude = '''
/(
    models
)/
'''

[tool.ruff]
line-length    = 128
target-version = "py312"
extend-exclude = ["models", "venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 - handled by black; UP009 - project style requires `# -*- coding: utf-8 -*-`.
ignore = ["E501", "UP009"]
# Project style forbids leading underscores, so deliberately unused names are
# spelled `unused_*`; teach ruff to treat that prefix as a throwaway.
dummy-variable-rgx = "^(_+|unused_[a-zA-Z0-9_]*)$"

[tool.mypy]
ignore_missing_imports = true
files                  = ["libs", "stt_server.py", "stt_client.py", "gu.py"]

[[tool.mypy.overrides]]
# `app.wsgi_app = ProxyFix(app.wsgi_app, ...)` is how Flask documents installing
# a WSGI middleware, and mypy reads the rebind as assigning to a method.
module             = ["stt_server"]
disable_error_code = ["method-assign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-q --cov --cov-report=term-missing"

[tool.coverage.run]
source = ["libs", "stt_server", "stt_client"]

[tool.coverage.report]
show_missing = true
