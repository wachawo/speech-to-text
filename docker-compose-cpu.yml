services:
  stt_server:
    build:
      context: .
      dockerfile: Dockerfile-cpu
    image: stt_server_cpu
    pull_policy: build
    container_name: stt_server
    hostname: stt_server
    restart: unless-stopped
    networks:
      - stt_network
    env_file:
      - .env
    environment:
      TZ: America/New_York
      STT_HOST: "0.0.0.0"
      STT_PORT: "${STT_PORT:-5099}"
      # One instance per model: this is also the pool of every STT_MODELS entry without @pool.
      # STT_MODELS and STT_DEFAULT_MODEL are deliberately NOT set here: they come from .env
      # through env_file, which this block would override.
      STT_POOL_SIZE: "1"
      STT_DEBUG: "false"
      MAX_CONTENT_LENGTH_MB: "10"
      CORS_ORIGINS: "*"
      GUNICORN_WORKERS: "4"
      WHISPER_DOWNLOAD_ROOT: "/opt/models"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      # Force CPU backend.
      COMPUTE_TYPE: "cpu"
      # Diarization stays off here. The model card names Ampere, Ada, Hopper and Blackwell and
      # never mentions CPU, and nobody has measured this path; a CPU build is a follow-up with
      # numbers behind it, not an assumption.
      DIARIZE_ENABLED: "false"
    ports:
      - "${STT_PORT:-5099}:${STT_PORT:-5099}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./stt_server.py:/opt/stt_server.py:ro
      - ./stt_client.py:/opt/stt_client.py:ro
      - ./gu.py:/opt/gu.py:ro
      - ./libs:/opt/libs:ro
      - ./models:/opt/models
      - ./logs:/opt/logs
      - ./recs:/opt/recs
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "128m"
        max-file: "3"
    entrypoint: ["/opt/entrypoint.sh"]
    command:
      - "python3 stt_server.py"
      # - "gunicorn --config gu.py stt_server:app"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${STT_PORT:-5099}/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  stt_www:
    build:
      context: .
      dockerfile: Dockerfile-www
    image: stt_www
    pull_policy: build
    container_name: stt_www
    hostname: stt_www
    restart: unless-stopped
    networks:
      - stt_network
    environment:
      TZ: America/New_York
      STT_UPSTREAM: "stt_server:${STT_PORT:-5099}"
      STT_WWW_TLS_PORT: "${STT_WWW_TLS_PORT:-8443}"
    ports:
      - "${STT_WWW_PORT:-8080}:80"
      # https: browsers hand an audio device only to a secure page, so live capture over the LAN
      # needs this listener. The certificate is self-signed on first start into ./data/certs.
      - "${STT_WWW_TLS_PORT:-8443}:443"
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./data/certs:/etc/nginx/certs
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    # service_started, not service_healthy: stt_server loads its models before it listens, and the
    # UI shows that wait itself - nginx answers 502 with a JSON error until the server is up.
    depends_on:
      stt_server:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "128m"
        max-file: "3"

networks:
  stt_network:
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.enable_ipv6: "false"

