services:
  stt_server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build the diarization backend into the image: DIARIZE=true docker compose up --build
        DIARIZE: "${DIARIZE:-false}"
        # Build the Parakeet backend into the image: PARAKEET=true docker compose up --build
        PARAKEET: "${PARAKEET:-false}"
    image: stt_server_gpu
    pull_policy: build
    container_name: stt_server
    hostname: stt_server
    restart: unless-stopped
    networks:
      - stt_network
    env_file:
      - .env
    environment:
      TZ: America/New_York
      STT_HOST: "0.0.0.0"
      STT_PORT: "${STT_PORT:-5099}"
      STT_POOL_SIZE: "1"
      STT_DEBUG: "false"
      # 100 MB covers about 50 minutes of 16 kHz WAV and hours of compressed audio; .env overrides it.
      MAX_CONTENT_LENGTH_MB: "${MAX_CONTENT_LENGTH_MB:-100}"
      CORS_ORIGINS: "*"
      GUNICORN_WORKERS: "4"
      WHISPER_DOWNLOAD_ROOT: "/opt/models"
      # Background jobs live under the bind-mounted recs/, so they survive a container rebuild.
      JOBS_DIR: "/opt/recs/jobs"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      # Force CUDA backend.
      COMPUTE_TYPE: "cuda"
      # DIARIZE_ENABLED is deliberately NOT set here: `environment:` overrides `env_file:`, so
      # pinning it would silently ignore the value in .env, which is where every document says
      # to put it. It is a runtime switch; DIARIZE above is the build arg. Turning it on for an
      # image built without the backend answers 503 and logs why, rather than failing to start.
      # STT_BACKEND selects the transcriber; parakeet needs a PARAKEET=true image.
      STT_BACKEND: "${STT_BACKEND:-whisper}"
      PARAKEET_DOWNLOAD_ROOT: "/opt/models"
      DIARIZE_POOL_SIZE: "1"
      # Pinned to the mount for the same reason WHISPER_DOWNLOAD_ROOT is: entrypoint.sh chowns
      # exactly these paths, and a cache anywhere else is a PermissionError for the stt user.
      DIARIZE_DOWNLOAD_ROOT: "/opt/models"
    ports:
      - "${STT_PORT:-5099}:${STT_PORT:-5099}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./stt_server.py:/opt/stt_server.py:ro
      - ./stt_client.py:/opt/stt_client.py:ro
      - ./gu.py:/opt/gu.py:ro
      - ./libs:/opt/libs:ro
      - ./models:/opt/models
      - ./logs:/opt/logs
      - ./recs:/opt/recs
    # GPU passthrough via CDI. Requires a CDI spec on the host:
    #   sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
    # (nvidia-container-toolkit >= 1.14; regenerate after a driver update).
    #
    # Preferred over deploy.resources.reservations.devices: with that form a
    # `systemctl daemon-reload` silently revokes the container's access to the
    # nvidia device nodes on cgroup v2. The container keeps running and looks
    # healthy, but nvidia-smi inside reports "Failed to initialize NVML" and
    # CUDA calls start failing with misleading cuDNN/cuBLAS errors.
    devices:
      - "nvidia.com/gpu=all"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "128m"
        max-file: "3"
    entrypoint: ["/opt/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${STT_PORT:-5099}/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command:
      - "python3 stt_server.py"
      # - "gunicorn --config gu.py stt_server:app"

  stt_www:
    build:
      context: .
      dockerfile: Dockerfile-www
    image: stt_www
    pull_policy: build
    container_name: stt_www
    hostname: stt_www
    restart: unless-stopped
    networks:
      - stt_network
    environment:
      TZ: America/New_York
      STT_UPSTREAM: "stt_server:${STT_PORT:-5099}"
      STT_WWW_TLS_PORT: "${STT_WWW_TLS_PORT:-8443}"
    ports:
      - "${STT_WWW_PORT:-8080}:80"
      # https: browsers hand an audio device only to a secure page, so live capture over the LAN
      # needs this listener. The certificate is self-signed on first start into ./data/certs.
      - "${STT_WWW_TLS_PORT:-8443}:443"
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./data/certs:/etc/nginx/certs
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    # service_started, not service_healthy: stt_server loads its models before it listens, and the
    # UI shows that wait itself - nginx answers 502 with a JSON error until the server is up.
    depends_on:
      stt_server:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "128m"
        max-file: "3"

networks:
  stt_network:
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.enable_ipv6: "false"

