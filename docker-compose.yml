services:
  stt_server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # The CUDA build, set from .env per host. The defaults are the main image (CUDA 13.0,
        # torch 2.10.0+cu130, for current cards and the GB10) and must stay equal to the ARG
        # defaults in the Dockerfile: compose passes every arg listed here, and an empty one would
        # replace the Dockerfile's default with an empty string. The five go together; a Pascal
        # host (Tesla P40) sets all five in .env, see .env.example and docs/DEPLOY.md.
        CUDA_IMAGE: "${CUDA_IMAGE:-nvidia/cuda:13.0.3-cudnn-runtime-ubuntu24.04}"
        CUBLAS_PACKAGE: "${CUBLAS_PACKAGE:-libcublas-13-0}"
        TORCH_VERSION: "${TORCH_VERSION:-2.10.0}"
        TORCH_CUDA: "${TORCH_CUDA:-cu130}"
        TORCH_ARCHES: "${TORCH_ARCHES:-sm_121 sm_120 compute_120}"
        # Build the diarization backend into the image: DIARIZE=true docker compose up --build
        DIARIZE: "${DIARIZE:-false}"
        # Build the Parakeet backend into the image: PARAKEET=true docker compose up --build
        PARAKEET: "${PARAKEET:-false}"
    image: stt_server_gpu
    pull_policy: build
    container_name: stt_server
    hostname: stt_server
    restart: unless-stopped
    networks:
      - stt_network
    env_file:
      - .env
    environment:
      # Every value in this block overrides env_file, so a literal here is a setting .env cannot
      # change. Anything a host may tune is therefore written "${NAME:-default}"; only what the
      # image and the bind mounts fix is pinned, each with its reason. DIARIZE_ENABLED, STT_MODELS,
      # STT_DEFAULT_MODEL and WHISPER_FP16 are not here at all: they come from .env through env_file.
      TZ: "${TZ:-America/New_York}"
      # Pinned: the server has to listen on every interface of the container to be reached through
      # the published port and from stt_www, whatever a .env written for a bare-metal run says.
      STT_HOST: "0.0.0.0"
      STT_PORT: "${STT_PORT:-5051}"
      # One instance per model, also the pool of every STT_MODELS entry without @pool.
      STT_POOL_SIZE: "${STT_POOL_SIZE:-1}"
      STT_DEBUG: "${STT_DEBUG:-false}"
      # 100 MB covers about 50 minutes of 16 kHz WAV and hours of compressed audio.
      MAX_CONTENT_LENGTH_MB: "${MAX_CONTENT_LENGTH_MB:-100}"
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-4}"
      # Pinned: the model caches live in the bind-mounted /opt/models. entrypoint.sh chowns exactly
      # that path, and a cache anywhere else is a PermissionError for the stt user.
      WHISPER_DOWNLOAD_ROOT: "/opt/models"
      PARAKEET_DOWNLOAD_ROOT: "/opt/models"
      DIARIZE_DOWNLOAD_ROOT: "/opt/models"
      # Pinned: background jobs live under the bind-mounted recs/, so they survive a rebuild.
      JOBS_DIR: "/opt/recs/jobs"
      # One thread unless .env says otherwise: more made the voice detector slower on the GB10.
      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-1}"
      MKL_NUM_THREADS: "${MKL_NUM_THREADS:-1}"
      # Pinned: this file is the GPU variant, so the CUDA backend and the nvidia runtime are what
      # it is. A host .env written for a bare-metal run may say COMPUTE_TYPE=auto. A host with
      # several cards picks the server's with CUDA_VISIBLE_DEVICES in .env.
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      COMPUTE_TYPE: "cuda"
      # The transcriber when STT_MODELS is empty; parakeet needs a PARAKEET=true image.
      STT_BACKEND: "${STT_BACKEND:-whisper}"
      # DIARIZE_ENABLED is the runtime switch and DIARIZE above the build arg. Turning it on for an
      # image built without the backend answers 503 and logs why, rather than failing to start.
      DIARIZE_POOL_SIZE: "${DIARIZE_POOL_SIZE:-1}"
    ports:
      - "${STT_PORT:-5051}:${STT_PORT:-5051}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./stt_server.py:/opt/stt_server.py:ro
      - ./stt_client.py:/opt/stt_client.py:ro
      - ./gu.py:/opt/gu.py:ro
      - ./libs:/opt/libs:ro
      - ./models:/opt/models
      - ./logs:/opt/logs
      - ./recs:/opt/recs
    # An upload pydub has to decode is copied by ffmpeg into an unlinked file under /tmp while it
    # decodes; a tmpfs keeps that copy in memory. Nothing else here has to survive a restart: the
    # model weights go to /opt/models, and /tmp holds only numba's cache and the other caches under
    # XDG_CACHE_HOME (both set by the image) and gu.py's model-load lock. A job's upload, which may
    # be gigabytes, is spooled under JOBS_DIR rather than here.
    tmpfs:
      - /tmp
    # GPU passthrough via CDI. Requires a CDI spec on the host:
    #   sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
    # (nvidia-container-toolkit >= 1.14; regenerate after a driver update).
    #
    # Preferred over deploy.resources.reservations.devices: with that form a
    # `systemctl daemon-reload` silently revokes the container's access to the
    # nvidia device nodes on cgroup v2. The container keeps running and looks
    # healthy, but nvidia-smi inside reports "Failed to initialize NVML" and
    # CUDA calls start failing with misleading cuDNN/cuBLAS errors.
    devices:
      - "nvidia.com/gpu=all"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "128m"
        max-file: "3"
    entrypoint: ["/opt/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${STT_PORT:-5051}/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Several large models load for longer than a minute: raise STT_HEALTH_START_PERIOD in .env.
      start_period: ${STT_HEALTH_START_PERIOD:-60s}
    # The run mode, from .env: STT_COMMAND="gunicorn --config gu.py stt_server:app" for sync workers,
    # or stt_server:asgi_app with GUNICORN_WORKER_CLASS=uvicorn_worker.UvicornWorker for the live
    # stream as well. entrypoint.sh runs the whole line through sh, so it is one string.
    command:
      - "${STT_COMMAND:-python3 stt_server.py}"

  stt_www:
    build:
      context: .
      dockerfile: Dockerfile-www
    image: stt_www
    pull_policy: build
    container_name: stt_www
    hostname: stt_www
    restart: unless-stopped
    networks:
      - stt_network
    environment:
      TZ: "${TZ:-America/New_York}"
      STT_UPSTREAM: "stt_server:${STT_PORT:-5051}"
      # The UI speaks https unless .env says STT_WWW_SCHEME=http; anything else stops nginx.
      STT_WWW_SCHEME: "${STT_WWW_SCHEME:-https}"
    ports:
      # One port, https or http after STT_WWW_SCHEME. On https a plain http request to it is
      # redirected, and browsers allow an audio device only there (or on localhost).
      - "${STT_WWW_PORT:-5053}:8080"
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./data/certs:/etc/nginx/certs
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    # service_started, not service_healthy: stt_server loads its models before it listens, and the
    # UI shows that wait itself - nginx answers 502 with a JSON error until the server is up.
    depends_on:
      stt_server:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "128m"
        max-file: "3"

networks:
  stt_network:
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.enable_ipv6: "false"

