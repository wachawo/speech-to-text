version: 2
updates:
  - package-ecosystem: pip
    # pyproject.toml holds the dev extras; requirements*.txt hold the exact
    # pins the Docker images install from.
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # torch and torchaudio are pinned to a CUDA build (cu130) in
      # requirements-gpu.txt and in the GPU Dockerfile. A bump has to happen in
      # both places at once, against a driver that supports it.
      - dependency-name: "torch"
      - dependency-name: "torchaudio"
      # torch needs sympy, and sympy 1.14.0 - the newest release - caps mpmath
      # below 1.4. A bump past that cap in constraints.txt leaves no installable
      # torch, and the image build fails. Drop this once a sympy release
      # accepts mpmath 1.4.
      - dependency-name: "mpmath"
        versions: [">=1.4"]
      # Every tokenizers release caps huggingface-hub below 2.0, and transformers
      # needs tokenizers. A bump past that cap in constraints.txt leaves no
      # installable transformers, and a GPU image with the diarizer or Parakeet
      # fails to build. Drop this once a tokenizers release accepts hub 2.0.
      - dependency-name: "huggingface-hub"
        versions: [">=2.0"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: ["minor", "patch"]
