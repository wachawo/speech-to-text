<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="STT">
  <title>STT</title>
  <!-- A waveform on the left becoming lines of text on the right, in the
       palette primary from css/main.css and nothing else.

       Strokes rather than <text>: a favicon is set in whatever the browser
       resolves `sans-serif` to, which is a different width on every platform,
       and three letters cannot be laid out inside 32 pixels by something that
       changes underneath them. Three bars and three rules keep their shape
       down to 16px.

       Nothing is filled. On a light tab the mark is blue on white; on a dark
       one it is blue on dark, which the palette primary has the weight for
       either way. -->
  <g fill="none" stroke="#3b89ca" stroke-width="3" stroke-linecap="round">
    <!-- The sound: three bars of different heights. -->
    <path d="M4 13 V19" />
    <path d="M9 7 V25" />
    <path d="M14 11 V21" />
    <!-- The text: three lines, the last one shorter, as a paragraph ends. -->
    <path d="M20 10 H28" />
    <path d="M20 16 H28" />
    <path d="M20 22 H25" />
  </g>
</svg>
